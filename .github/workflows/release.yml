name: Yayın

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  paket:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Paketle
        run: dotnet publish OrtakAlan.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish
      - name: Sıkıştır
        shell: pwsh
        run: Compress-Archive -Path publish/OrtakAlan.exe -DestinationPath OrtakAlan-win-x64.zip
      - name: Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Kurulum
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe","$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { throw "ISCC bulunamadı" }
          [xml]$proj = Get-Content -Raw -Path OrtakAlan.csproj
          $ver = @($proj.Project.PropertyGroup.Version) | Where-Object { $_ } | Select-Object -First 1
          & $iscc "/DMyAppVersion=$ver" "installer\OrtakAlan.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Rehber
        shell: pwsh
        run: Copy-Item "docs/Ortak Alan.pdf" -Destination Ortak-Alan.pdf
      - uses: softprops/action-gh-release@v2
        with:
          body: |
            Ortak Alan, Windows bilgisayarların birbirine klasör, yazıcı, mesaj ve dosya ulaştırması için yapılır.

            Kurulum için OrtakAlan-Setup.exe dosyasını çalıştırın. Kullanım Ortak-Alan.pdf dosyasındadır.

            Sürüm 2.0.2. Karanlık temada Favoriler ve Sabit mesajlar seçilince okunur. Künye yuvarlaktır; yeni sürümde çerçevesi sarı yanıp söner, ünlem logonun köşesindedir.

            Program 30 günlük deneme ile açılır. Lisanssız en çok beş kullanıcı eklenir. Anahtar bir bilgisayarda girilince aynı ağdaki diğer bilgisayarlar programı yeniden açtığında lisanslı olur. Program klasörü başka bilgisayara kopyalanırsa orada açılmaz.

            İletişim: LvntYxl@gmail.com
          files: |
            dist/OrtakAlan-Setup.exe
            OrtakAlan-win-x64.zip
            Ortak-Alan.pdf
